{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <title>
        {% block title %}
        Gestão de Projetos   
        {% endblock %}
    </title>
</head>

<body>
    <nav>
        <div class="container">
            <h1><a href="{% url 'home' %}">Gestão de Projetos</a></h1>

            <ul>
                <li>
                    <a href="{% url 'projetos' %}">
                        Projetos
                    </a>
                </li>

                <li>
                    <a href="{% url 'tarefas' %}">
                        Tarefas
                    </a>
                </li>

                <li>
                    <a href="{% url 'admin:index' %}">
                        Admin
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <main>

        {% if messages %}
            {% for message in messages %}
                <div class="mensagem">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>
</body>
</html>
