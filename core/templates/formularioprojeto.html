{% extends 'base.html' %}

{% block title %}
    {{ titulo }}
{% endblock %}

{% block content %}

<div class="cabecalho">
    <h2>{{ titulo }}</h2>
</div>

<div class="card">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary"
        >
            Salvar
        </button>

        <a
            href="{% url 'projetos' %}"
            class="btn btn-secondary"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
